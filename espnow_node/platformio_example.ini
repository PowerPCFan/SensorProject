[env:esp32dev]
; platform = espressif32 @ 7.0.1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
	bblanchon/ArduinoJson @ ^7.4.3
build_flags = 
	-DWIFI_SSID=\"SSID\"
	-DWIFI_PASS=\"PASSWORD\"
	-DSERVER_URL=\"http://ip:port/path\"
	-DAPI_KEY=\"API_KEY\"


	; uncomment to enable debug server
	; -DDEBUG_SERVER


	; uncomment and fill in all 3 flags below to enable webhook alarm
	
	; Your Discord Webhook URL
	; -DDISCORD_WEBHOOK_URL=\"https://discord.com/api/webhooks/...\"

	; Your Discord User ID
	; -DDISCORD_USER_ID=\"123456789012345678\"

	; The threshold in seconds for triggering the alarm
	; -DALARM_THRESHOLD=300
