[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit BME280 Library @ ^2.3.0
	adafruit/Adafruit Unified Sensor @ ^1.1.15

build_flags = 
	; Delay between updates
	-DPOST_DELAY_MS=10000

	; If you want ESP-NOW enabled:
	-DESPNOW_ENABLED
	-DESPNOW_NODE=\"aa:aa:aa:aa:aa:aa\"

	; If you want ESP-NOW disabled:
	; simply omit -DESPNOW_ENABLED and do not provide a -DESPNOW_NODE

	; Wi-Fi info
	-DWIFI_SSID=\"ssid\"
	-DWIFI_PASS=\"password\"

	; Your API URL and key
	-DSERVER_URL=\"http://localhost:8080/update/outdoor\"
	-DAPI_KEY=\"key\"

	; Pin for voltage divider if you're using one
	-DVOLTAGE_PIN=32

	; CPU Clock speed options (default is 240 MHz):
	; -DSLOW_CLOCK     ; 160 MHz
	; -DSLOWEST_CLOCK  ; 80 MHz

	; Debug HTTP server flag (Wi-Fi mode only)
	; -DDEBUG_SERVER
